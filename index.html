<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verschlüsselung – DES &amp; RSA</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #1d2430;
    --muted: #5b6575;
    --border: #d5dbe4;
    --accent: #2457c5;
    --accent-hover: #1b459e;
    --accent-soft: #e6edfb;
    --green: #1e7a46;
    --green-soft: #e4f4ea;
    --red: #b42828;
    --red-soft: #fbe7e7;
    --out: #f7f9fc;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d;
      --card: #1b212b;
      --text: #e7ebf2;
      --muted: #9aa5b6;
      --border: #313a48;
      --accent: #5b8cf0;
      --accent-hover: #7aa2f5;
      --accent-soft: #1f2c47;
      --green: #4cc483;
      --green-soft: #17301f;
      --red: #f07070;
      --red-soft: #3a1c1c;
      --out: #161b23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 8px;
  }
  h1 { margin: 0; font-size: 1.7rem; }

  .tabs {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
  }
  .tab {
    flex: 1;
    max-width: 320px;
    padding: 14px 18px;
    font-size: 1.05rem;
    font-weight: 600;
    border: 2px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    background: var(--card);
    color: var(--accent);
    border-color: var(--accent);
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  .panel {
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) var(--radius);
    padding: 20px;
  }
  .panel[hidden] { display: none; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card h2 {
    margin: 0;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card.full { margin-bottom: 20px; }

  label {
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .counter { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  .counter.ok { color: var(--green); font-weight: 600; }
  .counter.bad { color: var(--red); font-weight: 600; }

  textarea, input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 90px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.85rem;
    word-break: break-all;
  }
  textarea[readonly] { background: var(--out); }
  input.key {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 1.2rem;
    letter-spacing: 0.15em;
  }

  .btn {
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn.small {
    padding: 6px 12px;
    font-size: 0.85rem;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .btn.small:hover { filter: brightness(0.95); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .msg { font-size: 0.92rem; min-height: 0; }
  .msg:empty { display: none; }
  .msg.error {
    color: var(--red);
    background: var(--red-soft);
    padding: 8px 12px;
    border-radius: 8px;
  }

  .key-public { border-left: 6px solid var(--green); }
  .key-private { border-left: 6px solid var(--red); }
  .badge {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.red { background: var(--red-soft); color: var(--red); }

  .notice {
    background: var(--red-soft);
    color: var(--red);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>🔐 Verschlüsselung</h1>
</header>

<nav class="tabs" role="tablist">

  <button class="tab" role="tab" id="tab-rsa" aria-controls="panel-rsa" aria-selected="false">Asymmetrisch (RSA)</button>

<main>
  <!-- ======================= DES ======================= -->
  <section class="panel" id="panel-des" role="tabpanel" aria-labelledby="tab-des">
    <div class="grid">
      <div class="card">
        <h2>🔒 Verschlüsseln</h2>

        <label for="des-enc-plain">Klartext</label>
        <textarea id="des-enc-plain" placeholder="Nachricht eingeben …"></textarea>

        <label for="des-enc-key">Schlüssel (genau 8 Zeichen) <span class="counter" id="des-enc-count">0 / 8</span></label>
        <input type="text" class="key" id="des-enc-key" autocomplete="off" spellcheck="false" placeholder="z. B. Geheim12">

        <button class="btn" id="des-enc-btn">Verschlüsseln</button>
        <div class="msg" id="des-enc-msg"></div>

        <label for="des-enc-out">Geheimtext</label>
        <textarea id="des-enc-out" class="mono" readonly></textarea>
        <div class="row"><button class="btn small" data-copy="des-enc-out">📋 Kopieren</button></div>
      </div>

      <div class="card">
        <h2>🔓 Entschlüsseln</h2>

        <label for="des-dec-cipher">Geheimtext</label>
        <textarea id="des-dec-cipher" class="mono" placeholder="Geheimtext einfügen …"></textarea>

        <label for="des-dec-key">Schlüssel (genau 8 Zeichen) <span class="counter" id="des-dec-count">0 / 8</span></label>
        <input type="text" class="key" id="des-dec-key" autocomplete="off" spellcheck="false" placeholder="z. B. Geheim12">

        <button class="btn" id="des-dec-btn">Entschlüsseln</button>
        <div class="msg" id="des-dec-msg"></div>

        <label for="des-dec-out">Klartext</label>
        <textarea id="des-dec-out" readonly></textarea>
        <div class="row"><button class="btn small" data-copy="des-dec-out">📋 Kopieren</button></div>
      </div>
    </div>
  </section>

  <!-- ======================= RSA ======================= -->
  <section class="panel" id="panel-rsa" role="tabpanel" aria-labelledby="tab-rsa" hidden>
    <div class="notice" id="rsa-unsupported" hidden>
      RSA ist hier nicht verfügbar: Der Browser erlaubt die Kryptografie-Funktionen nur über HTTPS
      (z. B. GitHub Pages) oder als lokal geöffnete Datei.
    </div>

    <div class="card full">
      <h2>🗝️ Schlüsselpaar erzeugen</h2>
      <div class="row">
        <button class="btn" id="rsa-gen-btn">Neues Schlüsselpaar erzeugen</button>
        <span class="msg" id="rsa-gen-msg"></span>
      </div>
      <div class="grid">
        <div class="card key-public">
          <label for="rsa-pub-out">Öffentlicher Schlüssel <span class="badge green">darf weitergegeben werden</span></label>
          <textarea id="rsa-pub-out" class="mono" rows="9" readonly></textarea>
          <div class="row">
            <button class="btn small" data-copy="rsa-pub-out">📋 Kopieren</button>
            <button class="btn small" data-download="rsa-pub-out" data-filename="oeffentlicher_schluessel.pem">💾 Als Datei speichern</button>
          </div>
        </div>
        <div class="card key-private">
          <label for="rsa-priv-out">Privater Schlüssel <span class="badge red">geheim halten</span></label>
          <textarea id="rsa-priv-out" class="mono" rows="9" readonly></textarea>
          <div class="row">
            <button class="btn small" data-copy="rsa-priv-out">📋 Kopieren</button>
            <button class="btn small" data-download="rsa-priv-out" data-filename="privater_schluessel.pem">💾 Als Datei speichern</button>
          </div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>🔒 Verschlüsseln</h2>

        <label for="rsa-enc-key">Öffentlicher Schlüssel (des Empfängers)</label>
        <textarea id="rsa-enc-key" class="mono" rows="6" placeholder="-----BEGIN PUBLIC KEY----- …"></textarea>

        <label for="rsa-enc-plain">Klartext <span class="counter" id="rsa-enc-count">0 / 190 Byte</span></label>
        <textarea id="rsa-enc-plain" placeholder="z. B. den symmetrischen Schlüssel …"></textarea>

        <button class="btn" id="rsa-enc-btn">Verschlüsseln</button>
        <div class="msg" id="rsa-enc-msg"></div>

        <label for="rsa-enc-out">Geheimtext</label>
        <textarea id="rsa-enc-out" class="mono" rows="6" readonly></textarea>
        <div class="row"><button class="btn small" data-copy="rsa-enc-out">📋 Kopieren</button></div>
      </div>

      <div class="card">
        <h2>🔓 Entschlüsseln</h2>

        <label for="rsa-dec-key">Privater Schlüssel</label>
        <textarea id="rsa-dec-key" class="mono" rows="6" placeholder="-----BEGIN PRIVATE KEY----- …"></textarea>
        <div class="row"><button class="btn small" id="rsa-use-own">⬇ Eigenen privaten Schlüssel einsetzen</button></div>

        <label for="rsa-dec-cipher">Geheimtext</label>
        <textarea id="rsa-dec-cipher" class="mono" rows="6" placeholder="Geheimtext einfügen …"></textarea>

        <button class="btn" id="rsa-dec-btn">Entschlüsseln</button>
        <div class="msg" id="rsa-dec-msg"></div>

        <label for="rsa-dec-out">Klartext</label>
        <textarea id="rsa-dec-out" readonly></textarea>
        <div class="row"><button class="btn small" data-copy="rsa-dec-out">📋 Kopieren</button></div>
      </div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   DES (Data Encryption Standard) – reine JavaScript-Umsetzung
   Modus: ECB, Padding: PKCS#7, Text: UTF-8, Ausgabe: Base64
   Schlüssel: erste 8 Byte von SHA-256(Eingabe), siehe deriveDesKey()
   ============================================================ */
// DES-START
const DES = (() => {
  const PC1 = [57,49,41,33,25,17,9,1,58,50,42,34,26,18,10,2,59,51,43,35,27,19,11,3,60,52,44,36,
               63,55,47,39,31,23,15,7,62,54,46,38,30,22,14,6,61,53,45,37,29,21,13,5,28,20,12,4];
  const PC2 = [14,17,11,24,1,5,3,28,15,6,21,10,23,19,12,4,26,8,16,7,27,20,13,2,
               41,52,31,37,47,55,30,40,51,45,33,48,44,49,39,56,34,53,46,42,50,36,29,32];
  const SHIFTS = [1,1,2,2,2,2,2,2,1,2,2,2,2,2,2,1];
  const IP = [58,50,42,34,26,18,10,2,60,52,44,36,28,20,12,4,62,54,46,38,30,22,14,6,64,56,48,40,32,24,16,8,
              57,49,41,33,25,17,9,1,59,51,43,35,27,19,11,3,61,53,45,37,29,21,13,5,63,55,47,39,31,23,15,7];
  const FP = [40,8,48,16,56,24,64,32,39,7,47,15,55,23,63,31,38,6,46,14,54,22,62,30,37,5,45,13,53,21,61,29,
              36,4,44,12,52,20,60,28,35,3,43,11,51,19,59,27,34,2,42,10,50,18,58,26,33,1,41,9,49,17,57,25];
  const E = [32,1,2,3,4,5,4,5,6,7,8,9,8,9,10,11,12,13,12,13,14,15,16,17,
             16,17,18,19,20,21,20,21,22,23,24,25,24,25,26,27,28,29,28,29,30,31,32,1];
  const P = [16,7,20,21,29,12,28,17,1,15,23,26,5,18,31,10,2,8,24,14,32,27,3,9,19,13,30,6,22,11,4,25];
  const S = [
    [14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7, 0,15,7,4,14,2,13,1,10,6,12,11,9,5,3,8,
     4,1,14,8,13,6,2,11,15,12,9,7,3,10,5,0, 15,12,8,2,4,9,1,7,5,11,3,14,10,0,6,13],
    [15,1,8,14,6,11,3,4,9,7,2,13,12,0,5,10, 3,13,4,7,15,2,8,14,12,0,1,10,6,9,11,5,
     0,14,7,11,10,4,13,1,5,8,12,6,9,3,2,15, 13,8,10,1,3,15,4,2,11,6,7,12,0,5,14,9],
    [10,0,9,14,6,3,15,5,1,13,12,7,11,4,2,8, 13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1,
     13,6,4,9,8,15,3,0,11,1,2,12,5,10,14,7, 1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12],
    [7,13,14,3,0,6,9,10,1,2,8,5,11,12,4,15, 13,8,11,5,6,15,0,3,4,7,2,12,1,10,14,9,
     10,6,9,0,12,11,7,13,15,1,3,14,5,2,8,4, 3,15,0,6,10,1,13,8,9,4,5,11,12,7,2,14],
    [2,12,4,1,7,10,11,6,8,5,3,15,13,0,14,9, 14,11,2,12,4,7,13,1,5,0,15,10,3,9,8,6,
     4,2,1,11,10,13,7,8,15,9,12,5,6,3,0,14, 11,8,12,7,1,14,2,13,6,15,0,9,10,4,5,3],
    [12,1,10,15,9,2,6,8,0,13,3,4,14,7,5,11, 10,15,4,2,7,12,9,5,6,1,13,14,0,11,3,8,
     9,14,15,5,2,8,12,3,7,0,4,10,1,13,11,6, 4,3,2,12,9,5,15,10,11,14,1,7,6,0,8,13],
    [4,11,2,14,15,0,8,13,3,12,9,7,5,10,6,1, 13,0,11,7,4,9,1,10,14,3,5,12,2,15,8,6,
     1,4,11,13,12,3,7,14,10,15,6,8,0,5,9,2, 6,11,13,8,1,4,10,7,9,5,0,15,14,2,3,12],
    [13,2,8,4,6,15,11,1,10,9,3,14,5,0,12,7, 1,15,13,8,10,3,7,4,12,5,6,11,0,14,9,2,
     7,11,4,1,9,12,14,2,0,6,10,13,15,3,5,8, 2,1,14,7,4,10,8,13,15,12,9,0,3,5,6,11]
  ];

  const permute = (bits, table) => table.map(i => bits[i - 1]);
  const rotl = (a, n) => a.slice(n).concat(a.slice(0, n));

  function bytesToBits(bytes) {
    const bits = [];
    for (const b of bytes) for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
    return bits;
  }
  function bitsToBytes(bits) {
    const out = new Uint8Array(bits.length / 8);
    for (let i = 0; i < bits.length; i++) out[i >> 3] |= bits[i] << (7 - (i & 7));
    return out;
  }

  function subkeys(key) {
    const k = permute(bytesToBits(key), PC1);
    let c = k.slice(0, 28), d = k.slice(28);
    const keys = [];
    for (let i = 0; i < 16; i++) {
      c = rotl(c, SHIFTS[i]);
      d = rotl(d, SHIFTS[i]);
      keys.push(permute(c.concat(d), PC2));
    }
    return keys;
  }

  function feistel(r, k) {
    const x = permute(r, E).map((b, i) => b ^ k[i]);
    const out = [];
    for (let s = 0; s < 8; s++) {
      const b = x.slice(s * 6, s * 6 + 6);
      const row = (b[0] << 1) | b[5];
      const col = (b[1] << 3) | (b[2] << 2) | (b[3] << 1) | b[4];
      const v = S[s][row * 16 + col];
      for (let i = 3; i >= 0; i--) out.push((v >> i) & 1);
    }
    return permute(out, P);
  }

  function cryptBlock(block, keys) {
    const bits = permute(bytesToBits(block), IP);
    let l = bits.slice(0, 32), r = bits.slice(32);
    for (let i = 0; i < 16; i++) {
      const f = feistel(r, keys[i]);
      const newR = l.map((b, j) => b ^ f[j]);
      l = r;
      r = newR;
    }
    return bitsToBytes(permute(r.concat(l), FP));
  }

  function encrypt(data, key) {
    const keys = subkeys(key);
    const pad = 8 - (data.length % 8);
    const padded = new Uint8Array(data.length + pad);
    padded.set(data);
    padded.fill(pad, data.length);
    const out = new Uint8Array(padded.length);
    for (let i = 0; i < padded.length; i += 8) out.set(cryptBlock(padded.subarray(i, i + 8), keys), i);
    return out;
  }

  function decrypt(data, key) {
    if (data.length === 0 || data.length % 8 !== 0) throw new Error("length");
    const keys = subkeys(key).reverse();
    const out = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i += 8) out.set(cryptBlock(data.subarray(i, i + 8), keys), i);
    const pad = out[out.length - 1];
    if (pad < 1 || pad > 8) throw new Error("padding");
    for (let i = out.length - pad; i < out.length; i++) if (out[i] !== pad) throw new Error("padding");
    return out.slice(0, out.length - pad);
  }

  return { encrypt, decrypt, cryptBlock, subkeys };
})();
// DES-END

/* ============================ Hilfsfunktionen ============================ */
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder("utf-8", { fatal: true });

function toBase64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function fromBase64(str) {
  const clean = str.replace(/\s+/g, "");
  if (!/^[A-Za-z0-9+/]*={0,2}$/.test(clean)) throw new Error("base64");
  const bin = atob(clean);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function showMsg(id, text, isError = true) {
  const el = $(id);
  el.textContent = text || "";
  el.className = "msg" + (text && isError ? " error" : "");
}

/* ================================ Tabs ================================ */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => {
      const active = t === tab;
      t.setAttribute("aria-selected", active);
      $(t.getAttribute("aria-controls")).hidden = !active;
    });
  });
});

/* ======================= Kopieren & Speichern ======================= */
document.querySelectorAll("[data-copy]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const field = $(btn.dataset.copy);
    if (!field.value) return;
    try {
      await navigator.clipboard.writeText(field.value);
    } catch {
      field.select();
      document.execCommand("copy");
    }
    const old = btn.textContent;
    btn.textContent = "✓ Kopiert";
    setTimeout(() => (btn.textContent = old), 1500);
  });
});

document.querySelectorAll("[data-download]").forEach(btn => {
  btn.addEventListener("click", () => {
    const text = $(btn.dataset.download).value;
    if (!text) return;
    const url = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = btn.dataset.filename;
    a.click();
    URL.revokeObjectURL(url);
  });
});

/* ================================ DES ================================ */
function keyBytes(str) { return enc.encode(str); }

/* Aus den 8 eingegebenen Zeichen wird per SHA-256 der eigentliche DES-Schlüssel
   abgeleitet (erste 8 Byte des Hashwerts). So führt schon ein einziges anderes
   Zeichen zu einem völlig anderen Schlüssel. */
async function deriveDesKey(str) {
  const hash = await crypto.subtle.digest("SHA-256", enc.encode(str));
  return new Uint8Array(hash).slice(0, 8);
}

function updateCounter(inputId, counterId) {
  const n = keyBytes($(inputId).value).length;
  const c = $(counterId);
  c.textContent = n + " / 8";
  c.className = "counter " + (n === 0 ? "" : n === 8 ? "ok" : "bad");
}

function checkKey(str) {
  if (/[^\x20-\x7E]/.test(str)) return "Bitte keine Umlaute, kein ß und keine Sonderzeichen wie € im Schlüssel verwenden.";
  if (str.length !== 8) return `Der Schlüssel muss genau 8 Zeichen lang sein (aktuell: ${str.length}).`;
  return null;
}

["enc", "dec"].forEach(mode => {
  $(`des-${mode}-key`).addEventListener("input", () => updateCounter(`des-${mode}-key`, `des-${mode}-count`));
  $(`des-${mode}-key`).addEventListener("keydown", e => { if (e.key === "Enter") $(`des-${mode}-btn`).click(); });
});

$("des-enc-btn").addEventListener("click", async () => {
  $("des-enc-out").value = "";
  const text = $("des-enc-plain").value;
  const key = $("des-enc-key").value;
  if (!text) return showMsg("des-enc-msg", "Bitte einen Klartext eingeben.");
  const err = checkKey(key);
  if (err) return showMsg("des-enc-msg", err);
  try {
    const desKey = await deriveDesKey(key);
    $("des-enc-out").value = toBase64(DES.encrypt(enc.encode(text), desKey));
    showMsg("des-enc-msg", "");
  } catch {
    showMsg("des-enc-msg", "Verschlüsselung fehlgeschlagen. Die Seite muss über HTTPS oder als lokale Datei geöffnet werden.");
  }
});

$("des-dec-btn").addEventListener("click", async () => {
  $("des-dec-out").value = "";
  const cipher = $("des-dec-cipher").value.trim();
  const key = $("des-dec-key").value;
  if (!cipher) return showMsg("des-dec-msg", "Bitte einen Geheimtext einfügen.");
  const err = checkKey(key);
  if (err) return showMsg("des-dec-msg", err);

  let data;
  try {
    data = fromBase64(cipher);
  } catch {
    return showMsg("des-dec-msg", "Der Geheimtext ist ungültig. Wurde er vollständig kopiert?");
  }
  if (data.length === 0 || data.length % 8 !== 0) {
    return showMsg("des-dec-msg", "Der Geheimtext ist unvollständig oder beschädigt.");
  }
  let desKey;
  try {
    desKey = await deriveDesKey(key);
  } catch {
    return showMsg("des-dec-msg", "Entschlüsselung fehlgeschlagen. Die Seite muss über HTTPS oder als lokale Datei geöffnet werden.");
  }
  try {
    $("des-dec-out").value = dec.decode(DES.decrypt(data, desKey));
    showMsg("des-dec-msg", "");
  } catch {
    showMsg("des-dec-msg", "Entschlüsselung fehlgeschlagen – der Schlüssel ist wahrscheinlich falsch.");
  }
});

/* ================================ RSA ================================ */
const RSA_ALGO = { name: "RSA-OAEP", hash: "SHA-256" };
const RSA_MAX_BYTES = 190; // 2048 Bit, OAEP mit SHA-256
const rsaAvailable = !!(window.crypto && window.crypto.subtle);
if (!rsaAvailable) {
  $("rsa-unsupported").hidden = false;
  ["rsa-gen-btn", "rsa-enc-btn", "rsa-dec-btn"].forEach(id => ($(id).disabled = true));
}

function toPem(buffer, label) {
  const b64 = toBase64(new Uint8Array(buffer));
  const lines = b64.match(/.{1,64}/g).join("\n");
  return `-----BEGIN ${label}-----\n${lines}\n-----END ${label}-----`;
}

function fromPem(pem, expected) {
  const m = pem.match(/-----BEGIN ([A-Z ]+)-----([\s\S]*?)-----END \1-----/);
  if (m && m[1] !== expected) throw new Error("wrongtype:" + m[1]);
  const body = m ? m[2] : pem;
  return fromBase64(body).buffer;
}

$("rsa-gen-btn").addEventListener("click", async () => {
  const btn = $("rsa-gen-btn");
  btn.disabled = true;
  showMsg("rsa-gen-msg", "Wird erzeugt …", false);
  try {
    const pair = await crypto.subtle.generateKey(
      { ...RSA_ALGO, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) },
      true,
      ["encrypt", "decrypt"]
    );
    $("rsa-pub-out").value = toPem(await crypto.subtle.exportKey("spki", pair.publicKey), "PUBLIC KEY");
    $("rsa-priv-out").value = toPem(await crypto.subtle.exportKey("pkcs8", pair.privateKey), "PRIVATE KEY");
    showMsg("rsa-gen-msg", "");
  } catch {
    showMsg("rsa-gen-msg", "Das Schlüsselpaar konnte nicht erzeugt werden.");
  } finally {
    btn.disabled = false;
  }
});

$("rsa-use-own").addEventListener("click", () => {
  const own = $("rsa-priv-out").value;
  if (!own) return showMsg("rsa-dec-msg", "Es wurde noch kein eigenes Schlüsselpaar erzeugt.");
  $("rsa-dec-key").value = own;
  showMsg("rsa-dec-msg", "");
});

$("rsa-enc-plain").addEventListener("input", () => {
  const n = enc.encode($("rsa-enc-plain").value).length;
  const c = $("rsa-enc-count");
  c.textContent = `${n} / ${RSA_MAX_BYTES} Byte`;
  c.className = "counter" + (n > RSA_MAX_BYTES ? " bad" : "");
});

$("rsa-enc-btn").addEventListener("click", async () => {
  $("rsa-enc-out").value = "";
  const pem = $("rsa-enc-key").value.trim();
  const text = $("rsa-enc-plain").value;
  if (!pem) return showMsg("rsa-enc-msg", "Bitte den öffentlichen Schlüssel einfügen.");
  if (!text) return showMsg("rsa-enc-msg", "Bitte einen Klartext eingeben.");
  const data = enc.encode(text);
  if (data.length > RSA_MAX_BYTES) {
    return showMsg("rsa-enc-msg", `Der Text ist zu lang für RSA (max. ${RSA_MAX_BYTES} Byte).`);
  }

  let key;
  try {
    key = await crypto.subtle.importKey("spki", fromPem(pem, "PUBLIC KEY"), RSA_ALGO, false, ["encrypt"]);
  } catch (e) {
    if (String(e.message).startsWith("wrongtype:PRIVATE")) {
      return showMsg("rsa-enc-msg", "Das ist ein privater Schlüssel! Zum Verschlüsseln wird der öffentliche Schlüssel benötigt.");
    }
    return showMsg("rsa-enc-msg", "Der öffentliche Schlüssel ist ungültig. Wurde er vollständig kopiert?");
  }
  try {
    const cipher = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, data);
    $("rsa-enc-out").value = toBase64(new Uint8Array(cipher));
    showMsg("rsa-enc-msg", "");
  } catch {
    showMsg("rsa-enc-msg", "Verschlüsselung fehlgeschlagen.");
  }
});

$("rsa-dec-btn").addEventListener("click", async () => {
  $("rsa-dec-out").value = "";
  const pem = $("rsa-dec-key").value.trim();
  const cipher = $("rsa-dec-cipher").value.trim();
  if (!pem) return showMsg("rsa-dec-msg", "Bitte den privaten Schlüssel einfügen.");
  if (!cipher) return showMsg("rsa-dec-msg", "Bitte einen Geheimtext einfügen.");

  let key;
  try {
    key = await crypto.subtle.importKey("pkcs8", fromPem(pem, "PRIVATE KEY"), RSA_ALGO, false, ["decrypt"]);
  } catch (e) {
    if (String(e.message).startsWith("wrongtype:PUBLIC")) {
      return showMsg("rsa-dec-msg", "Das ist ein öffentlicher Schlüssel! Zum Entschlüsseln wird der private Schlüssel benötigt.");
    }
    return showMsg("rsa-dec-msg", "Der private Schlüssel ist ungültig. Wurde er vollständig kopiert?");
  }

  let data;
  try {
    data = fromBase64(cipher);
  } catch {
    return showMsg("rsa-dec-msg", "Der Geheimtext ist ungültig. Wurde er vollständig kopiert?");
  }
  try {
    const plain = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, key, data);
    $("rsa-dec-out").value = dec.decode(plain);
    showMsg("rsa-dec-msg", "");
  } catch {
    showMsg("rsa-dec-msg", "Entschlüsselung fehlgeschlagen – passt der private Schlüssel zum öffentlichen Schlüssel, mit dem verschlüsselt wurde?");
  }
});

/* Warnung vor dem Neuladen, damit der private Schlüssel nicht versehentlich verloren geht */
window.addEventListener("beforeunload", e => {
  if ($("rsa-priv-out").value) { e.preventDefault(); e.returnValue = ""; }
});
</script>
